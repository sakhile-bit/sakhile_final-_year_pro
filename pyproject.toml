[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zambia-digital-hygiene"
dynamic = ["version"]
description = "Zambia Digital Hygiene Assessment Tool - cybersecurity assessment, hardening and certification for SMEs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sakhile" }]
keywords = [
    "security",
    "cybersecurity",
    "assessment",
    "hardening",
    "compliance",
    "zambia",
    "sme",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

# Core dependencies — everything the CLI needs out of the box
# (assess, scan, harden, agent, fleet-scan, web dashboard, reports).
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "psutil>=5.9",
    "PyYAML>=6.0",
    "requests>=2.31",
    "cryptography>=42.0",
    "Jinja2>=3.1",
    "SQLAlchemy>=2.0",
    "Flask>=3.0",
    "Flask-SQLAlchemy>=3.1",
    "Flask-Login>=0.6",
    "Flask-WTF>=1.2",
    "Werkzeug>=3.0",
    "pyotp>=2.9",
    "qrcode[pil]>=7.4",
]

[project.optional-dependencies]
pdf = ["reportlab>=4.0"]           # PDF report generation
mysql = ["mysql-connector-python>=8.0"]
postgres = ["psycopg2-binary>=2.9"]
ad = ["ldap3>=2.9"]                # Active Directory auditing
audit = ["pip-audit>=2.7"]         # dependency vulnerability scanning
gui = ["customtkinter>=5.2", "Pillow>=10.0"]  # desktop app
server = ["gunicorn>=21.0"]        # production WSGI server
all = [
    "zambia-digital-hygiene[pdf,mysql,postgres,ad,audit,gui,server]",
]

[project.scripts]
zamsec = "src.utils.cli:cli"
zambia-hygiene = "src.utils.cli:cli"

[project.urls]
Homepage = "https://github.com/sakhile-bit/sakhile_final-_year_pro"
Repository = "https://github.com/sakhile-bit/sakhile_final-_year_pro"
Issues = "https://github.com/sakhile-bit/sakhile_final-_year_pro/issues"

[tool.setuptools.dynamic]
version = { attr = "src.__version__" }

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.setuptools.package-data]
"src.web" = ["templates/**/*", "static/**/*"]
"src.web.admin" = ["templates/**/*"]
"src.reporting" = ["templates/**/*"]
